# Ingress: instrada le richieste per l'host nginx.lab.local verso il Service nginx-demo.
# Il controller (Traefik) è esposto con un IP del pool MetalLB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-demo
spec:
  ingressClassName: traefik
  rules:
    - host: nginx.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-demo
                port:
                  number: 80
