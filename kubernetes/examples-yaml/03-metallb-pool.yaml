# Configurazione MetalLB in modalità Layer 2.
# Il pool deve stare nella stessa LAN dei nodi (192.168.1.0/24) ma FUORI
# dal range DHCP del router e dagli IP già assegnati (200-202 sono i nodi).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.240-192.168.1.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-pool
