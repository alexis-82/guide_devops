# Release di un'immagine Docker su GitHub Container Registry (ghcr.io).
# Da copiare in .github/workflows/release-docker.yml
# Richiede un Dockerfile nella root del repo.
#
# Tag git v1.2.3  ->  ghcr.io/<utente>/<repo>:1.2.3, :1.2 e :latest
name: Release Docker

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write  # serve per pubblicare su ghcr.io

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Login con il token della run: nessun segreto da configurare
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Calcola nome e tag dell'immagine a partire dal tag git
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha  # riusa i layer delle build precedenti
          cache-to: type=gha,mode=max
