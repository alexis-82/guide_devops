# CI di Zenith: a ogni push su main e a ogni pull request verifica che
# il codice compili e che i test passino. Non produce nulla da scaricare.
# Da copiare in: zenith/.github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nuovo push sullo stesso branch annulla la run precedente ancora in corso
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (svelte-check + vitest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  go:
    name: Go (vet + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails su Linux compila con cgo contro GTK3 e WebKitGTK 4.1
      - name: Dipendenze di sistema Wails
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go incorpora frontend/dist con //go:embed: senza build del
      # frontend il pacchetto principale non compila
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - run: go vet -tags webkit2_41 ./...
      - run: go test -tags webkit2_41 ./...
