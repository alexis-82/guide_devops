# Release di Zenith: parte quando si pubblica un tag vX.Y.Z.
#   test -> build Windows + build Linux (in parallelo) -> GitHub Release
# Da copiare in: zenith/.github/workflows/release.yml
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 1. Stessi controlli della CI: niente release se un test fallisce
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dipendenze di sistema Wails
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Frontend (check, test, build)
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - run: go test -tags webkit2_41 ./...

  # 2a. Windows: eseguibile portable + installer NSIS
  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa Wails CLI e NSIS
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          choco install nsis -y --no-progress
      - name: Build
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"          # es. v1.2.0
          $ver = $tag.TrimStart("v")               # es. 1.2.0
          wails build -ldflags "-X main.version=$tag"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$ver build\windows\installer\zenith.nsi
          Copy-Item build\bin\zenith.exe "build\bin\zenith-$ver-amd64-portable.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build/bin/*-installer.exe
            build/bin/*-portable.exe
          if-no-files-found: error

  # 2b. Linux: tar.gz nel formato atteso da install.sh e zenith-update.sh
  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dipendenze di sistema Wails
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Installa Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Build + pacchetto
        run: |
          wails build -tags webkit2_41 -ldflags "-X main.version=${{ github.ref_name }}"
          sh build/linux/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: build/bin/zenith-linux-*.tar.gz
          if-no-files-found: error

  # 3. Raccoglie i file, calcola i checksum e pubblica la release
  release:
    name: GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # serve per creare la release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # storia completa e tag, per le note di rilascio
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksum SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      # Note = elenco dei commit dal tag precedente. Zenith le mostra
      # all'utente nella finestra di aggiornamento.
      - name: Note di rilascio
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          { echo "## Novità"; echo; git log --no-merges --pretty='- %s' "$range"; } > notes.md
          cat notes.md
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Zenith $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
